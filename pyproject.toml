[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "barra"
version = "0.1.0"
description = "Download and process Barra Models Direct risk model files"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["paramiko>=3.2"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
barra-download = "barra.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
